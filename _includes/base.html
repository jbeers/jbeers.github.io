<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title | escape }} | Jacob Beers</title>
  <meta name="description" content="{{ description | default: 'Software engineer, technical leader, and conference speaker. Languages, developer tools, and software in production.' | escape }}">
  <script src="{{ '/theme.js' | url }}"></script>
  <link rel="preload" href="{{ '/res/fonts/fraunces-700.ttf' | url }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ '/style.css' | url }}">
  {% if interactive %}<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | url }}">Jacob Beers</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/article/' | url }}"{% if page.url contains '/article/' %} aria-current="page"{% endif %}>Articles</a>
        <a href="{{ '/talks/' | url }}"{% if page.url contains '/talks/' %} aria-current="page"{% endif %}>Talks</a>
        <a href="{{ '/about/' | url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
      <button class="theme-toggle" type="button" hidden>Switch theme</button>
    </header>
    <main id="main-content" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <div><a class="wordmark" href="{{ '/' | url }}">Jacob Beers</a><p>Software, systems, and things worth sharing.</p></div>
      <div class="footer-links">
        <a href="mailto:jacobtbeers@gmail.com">Get in touch <span aria-hidden="true">↗</span></a>
        <a href="https://github.com/jbeers">GitHub</a>
        <a href="{{ '/cheat/' | url }}">Cheat sheet</a>
        <a href="{{ '/terminal/' | url }}">Terminal</a>
      </div>
    </footer>
  </div>
</body>
</html>
